# Archivo de Definición para Laravel Blueprint
# Basado en el Modelo de Negocio de Mantenimiento del Hogar
#
# Instrucciones:
# 1. Guarda este contenido como 'draft.yaml' en la raíz de tu proyecto Laravel.
# 2. Ejecuta: php artisan blueprint:build
# 3. Para generar los recursos de FilamentPHP, ejecuta: php artisan blueprint:build --add=filament
#    (Esto creará automáticamente los resources para los controladores definidos abajo)

models:


  Customer:
    user_id: id foreign
    first_name: string
    last_name: string
    rut: string unique
    phone_number: string nullable
    notification_preferences: json nullable
    preferred_contact_method: string
    authorized_representative: string nullable # For SERNAC purposes
    billing_data: json nullable # Razón social, giro, etc.
    relationships:
      belongsTo: User
      hasMany: Home, Appointment, MaintenancePlan

  Technician:
    user_id: id foreign # Foreign key to User model 
    first_name: string # First name of the technician
    last_name: string # Last name of the technician
    rut: string unique # RUT of the technician
    phone_number: string nullable # Phone number of the technician
    is_active: boolean  default:true # Is the technician active?
    picture_url: string nullable # Picture URL of the technician
    description: text nullable
    relationships:
      belongsTo: User
      hasMany: Appointment, TechnicianAvailability, AppointmentLog
      belongsToMany: Service # Pivot: technician_skills

  ServiceCategory:
    name: string unique
    description: text nullable
    icon: string nullable
    slug: string unique
    is_active: boolean  default:true
    sort_order: integer  default:0
    meta_title: string nullable
    meta_description: string nullable
    meta_keywords: string nullable
    og_title: string nullable
    og_description: string nullable
    og_image: string nullable
    relationships:
      hasMany: Service

  Service:
    service_category_id: id foreign
    name: string unique
    short_description: text
    long_description: text nullable
    icon: string nullable
    base_price: decimal:10,2
    base_duration_minutes: integer
    is_emergency_available: boolean default:false
    emergency_surcharge: decimal:10,2 nullable
    slug: string unique
    is_active: boolean  default:true
    sort_order: integer  default:0
    # Service Area Restrictions - Handled by the ServiceArea model
    travel_fee_per_km: decimal:10,2 nullable
    requires_site_inspection: boolean default:false
    # Survey Template
    satisfaction_survey_template: json nullable # Custom questions for this service
    # SEO fields
    meta_title: string nullable
    meta_description: string nullable
    meta_keywords: string nullable
    og_title: string nullable
    og_description: string nullable
    og_image: string nullable
    schema_markup: json nullable
    protocol_url: string nullable
    relationships:
      belongsTo: ServiceCategory
      hasMany: Appointment, ServiceParameter, PlanScheduledService, ServiceArea
      belongsToMany: Technician # Pivot: technician_skills

  Appointment:
    customer_id: id foreign
    service_id: id foreign
    technician_id: id foreign
    plan_scheduled_service_id: id foreign nullable
    home_id: id foreign
    home_asset_id: id foreign nullable
    scheduled_start_datetime: datetime
    calculated_end_datetime: datetime
    final_price: decimal:10,2
    tax_amount: decimal:10,2
    is_emergency: boolean default:false
    status: string
    notes_for_technician: text nullable
    customer_notes: text nullable
    cancellation_reason: text nullable
    payment_method: string nullable
    payment_status: string
    is_rated: boolean default:false
    relationships:
      belongsTo: Customer, Service, Technician, PlanScheduledService, Home, HomeAsset
      hasMany: AppointmentLog
      hasOne: AppointmentRating
      belongsToMany: ServiceParameterOption # Pivot: appointment_selected_options

  TechnicianAvailability:
    technician_id: id foreign
    start_datetime: datetime
    end_datetime: datetime
    relationships:
      belongsTo: Technician

  ServiceParameter:
    service_id: id foreign
    name: string
    description: string nullable
    relationships:
      belongsTo: Service
      hasMany: ServiceParameterOption

  ServiceParameterOption:
    service_parameter_id: id foreign
    option_value: string
    price_adjustment: decimal:10,2  default:0
    duration_minutes_adjustment: integer  default:0
    measurement_unit: string nullable 
    relationships:
      belongsTo: ServiceParameter
      belongsToMany: Appointment # Pivot: appointment_selected_options

  MaintenancePlan:
    customer_id: id foreign
    year: year
    status: string
    relationships:
      belongsTo: Customer
      hasMany: PlanScheduledService

  PlanScheduledService:
    maintenance_plan_id: id foreign
    service_id: id foreign
    recommended_month: integer
    status: string default:'pending'
    notes: text nullable
    relationships:
      belongsTo: MaintenancePlan, Service
      hasOne: Appointment

  Home:
    customer_id: id foreign
    name: string
    address: text
    region: string # Chilean region
    comuna: string # Chilean comuna
    postal_code: string nullable
    square_meters: integer nullable
    condominium_name: string nullable
    geo_location: json nullable
    is_primary: boolean default:false
    access_instructions: text nullable
    security_instructions: text nullable
    relationships:
      belongsTo: Customer
      hasMany: HomeAsset, Appointment

  HomeAsset:
    home_id: id foreign
    name: string
    asset_type: string
    brand: string nullable
    model: string nullable
    serial_number: string nullable
    installation_date: date nullable
    notes: text nullable
    relationships:
      belongsTo: Home
      hasMany: Appointment

  AppointmentLog:
    appointment_id: id foreign
    technician_id: id foreign # Quién hizo el registro
    log_type: enum:text_note,before_photo,after_photo,document
    content_url: string nullable # Para la URL de la imagen/documento
    notes: text nullable
    relationships:
      belongsTo: Appointment, Technician

  ServiceArea:
    service_id: id foreign
    region: string
    comuna: string
    is_available: boolean  default:true
    min_price: decimal:10,2 nullable
    travel_fee: decimal:10,2 nullable
    minimum_notice_hours: integer nullable
    relationships:
      belongsTo: Service

  # SurveyTemplate:
  #   service_id: foreignId nullable # If null, it's a global template
  #   name: string
  #   description: text nullable
  #   questions: json # Array of questions with types and options
  #   is_active: boolean  default:true
  #   created_at: timestamp
  #   updated_at: timestamp
  #   relationships:
  #     belongsTo: Service
  #     hasMany: SurveyResponse

  # SurveyResponse:
  #   appointment_id: foreignId
  #   template_id: foreignId
  #   answers: json
  #   submitted_at: timestamp
  #   relationships:
  #     belongsTo: Appointment, SurveyTemplate

  AppointmentRating:
    appointment_id: id foreign
    work_quality_rating: integer # 1-5
    punctuality_rating: integer # 1-5
    communication_rating: integer # 1-5
    cleanliness_rating: integer # 1-5
    value_rating: integer # 1-5
    overall_rating: integer # 1-5
    public_review: text nullable
    private_feedback: text nullable
    is_public: boolean  default:true
    helpful_votes_count: integer  default:0
    rating_reminder_sent_at: timestamp nullable
    custom_responses: json nullable # For service-specific questions
    relationships:
      belongsTo: Appointment
      hasMany: RatingVote

  Payment:
    appointment_id: id foreign nullable
    maintenance_plan_id: id foreign nullable
    amount: decimal:10,2
    status: enum:pending,completed,failed,refunded
    payment_method: enum:webpay,webpay_plus,webpay_oneclick,khipu,mach,mercadopago,bank_transfer,cash,check,debit_card,credit_card,pat
    payment_platform: enum:transbank,khipu,mercadopago,manual nullable
    
    # Webpay (Transbank) fields
    webpay_token: string nullable
    webpay_session_id: string nullable
    webpay_transaction_id: string nullable
    webpay_card_type: string nullable
    webpay_card_number: string nullable # Last 4 digits
    webpay_auth_code: string nullable
    webpay_response_code: string nullable
    
    # Khipu fields
    khipu_payment_id: string nullable
    khipu_transfer_id: string nullable
    khipu_bank_id: string nullable
    khipu_bank_name: string nullable
    
    # Bank transfer fields
    bank_name: string nullable
    bank_account_type: string nullable
    bank_account_number: string nullable
    bank_transfer_date: date nullable
    bank_transfer_number: string nullable
    
    # PAT (Pago Automático con Tarjeta) fields
    pat_subscription_id: string nullable
    pat_authorization_code: string nullable
    pat_last_four: string nullable
    
    # MACH fields
    mach_transaction_id: string nullable
    
    # Document fields
    document_type: string nullable
    document_number: string nullable
    tax_id: string nullable # RUT for Chilean invoices
    business_name: string nullable # Razón social
    business_activity: string nullable # Giro
    business_address: string nullable
    
    # General fields
    notes: text nullable
    paid_at: timestamp nullable
    refunded_at: timestamp nullable
    refund_reason: text nullable
    internal_reference: string nullable
    relationships:
      belongsTo: Appointment, MaintenancePlan

  RatingVote:
    rating_id: id foreign
    customer_id: id foreign
    is_helpful: boolean
    relationships:
      belongsTo: AppointmentRating, Customer

  Notification:
    user_id: id foreign
    title: string
    content: text
    type: enum:appointment_reminder,maintenance_due,payment_reminder,rating_reminder,warranty_expiring,referral_earned
    read_at: timestamp nullable
    scheduled_at: timestamp nullable
    sent_at: timestamp nullable
    data: json nullable
    relationships:
      belongsTo: User

  Warranty:
    service_id: id foreign
    appointment_id: id foreign
    duration_months: integer
    starts_at: timestamp
    expires_at: timestamp
    terms: text nullable
    status: string
    void_reason: text nullable
    notification_sent: boolean default:false
    relationships:
      belongsTo: Service, Appointment

  Referral:
    referrer_id: id foreign:customers # Customer who refers
    referred_id: id foreign nullable:customers # Customer who was referred
    code: string unique
    status: enum:active,used,expired
    discount_amount: decimal:10,2
    discount_type: string
    expires_at: timestamp nullable
    used_at: timestamp nullable
    relationships:
      belongsTo: Customer
      hasMany: ReferralReward

  ReferralReward:
    referral_id: id foreign # The referral that generated the reward
    beneficiary_id: id foreign:customers # Customer who gets the reward
    amount: decimal:10,2
    status: string default:'pending'
    appointment_id: id foreign nullable # The qualifying appointment
    paid_at: timestamp nullable
    relationships:
      belongsTo: Referral, Customer, Appointment